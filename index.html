        #calendarWrapper {

            opacity: 0;

        #calendarWrapper.visible {

            <p class="text-xs text-[#C2847A] font-semibold tracking-wide uppercase mt-1">Gaming Enthusiast</p>

            <!-- Links -->

                <a href="https://www.linkedin.com/in/ssouraiana/" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between w-full bg-[#1B4332] hover:bg-[#122e22] text-white font-medium py-3.5 px-5 rounded-xl transition-all duration-300 shadow-sm group">

                    <span class="flex items-center">
                        <svg class="w-5 h-5 mr-3 stroke-current text-[#1B4332]" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>

                        Agendar uma conversa
                    </span>
                    <span class="text-xs transition-transform group-hover:translate-y-0.5">↓</span>
                </button>

                <!-- Calendário Embutido -->
                <div id="calendarWrapper">
                    <div class="pt-2">
                        <div id="calendarContainer" class="rounded-2xl overflow-hidden border border-gray-200 bg-gray-50">

                                src="https://calendar.google.com/calendar/appointments/AcZssZ08ZpFF6R4ASZ7IHJkWFpsuQa55bPZYCNdduzg=?gv=true"

            <!-- Rodapé -->

    </div>

    <script>
        const scheduleButton = document.getElementById('scheduleButton');
        const calendarWrapper = document.getElementById('calendarWrapper');

        scheduleButton.addEventListener('click', () => {
            calendarWrapper.classList.toggle('visible');
            if (calendarWrapper.classList.contains('visible')) {
                setTimeout(() => {
                    calendarWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 150);
            }
        });
    </script>
